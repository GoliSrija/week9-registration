<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <center>
        <h2>Registration Form</h2>

        <form action="/success" method="POST">
            <label>Name:</label>
            <input type="text" name="name" required>
            <br><br>

            <label>Year:</label>
            <input type="text" name="year" required>
            <br><br>

            <button type="submit">Register</button>
        </form>
    </center>
</body>
</html>
